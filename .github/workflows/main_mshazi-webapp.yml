name: Build and deploy ASP.Net Core app to Azure Web App - mshazi-webapp

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore dependencies
        run: dotnet restore ./ReadItApp/ReadItApp.csproj

      - name: Build with dotnet
        run: dotnet build ./ReadItApp/ReadItApp.csproj --configuration Release --no-restore

      - name: dotnet publish
        run: dotnet publish ./ReadItApp/ReadItApp.csproj --configuration Release --output ${{env.DOTNET_ROOT}}/myapp --no-restore

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_9850129188E14679B99300A9EB8B66E8 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_08CF0E8FCD414D9E8D5C5C512A75DFD9 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3F2DC9AFF4944E1B9A24EFC880EA48B7 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'mshazi-webapp'
          slot-name: 'Production'
          package: .  # Deploys the contents of the current directory (which is the artifact)

          
